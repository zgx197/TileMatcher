<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TileMatcher 牌局内容生产工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">TileMatcher Workbench</p>
          <h1>牌局内容生产工作台</h1>
          <p class="hero-copy">围绕离线批次、候选筛选、人工标记和正式关卡编排演进的本地工作台第一版骨架。</p>
        </div>
        <div class="hero-card">
          <span class="hero-label">当前批次</span>
          <strong id="hero-batch-name">加载中</strong>
          <span id="hero-generated-at" class="hero-meta">-</span>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Batch</p>
                <h2>批次与筛选</h2>
              </div>
            </div>

            <label class="field">
              <span>当前批次</span>
              <select id="batch-select"></select>
            </label>

            <label class="field">
              <span>搜索</span>
              <input id="search-input" type="search" placeholder="按 CandidateId、标签、备注搜索" />
            </label>

            <div class="field-grid">
              <label class="field">
                <span>筛选结果</span>
                <select id="decision-select">
                  <option value="">全部</option>
                </select>
              </label>
              <label class="field">
                <span>难度桶</span>
                <select id="difficulty-select">
                  <option value="">全部</option>
                </select>
              </label>
            </div>

            <div class="field-grid">
              <label class="field">
                <span>标签</span>
                <select id="tag-select">
                  <option value="">全部</option>
                </select>
              </label>
              <label class="field">
                <span>人工标记</span>
                <select id="mark-select">
                  <option value="">全部</option>
                </select>
              </label>
            </div>

            <div class="field-grid">
              <label class="field">
                <span>最低推荐分</span>
                <input id="min-score-input" type="number" min="0" max="1" step="0.01" placeholder="0.00" />
              </label>
              <label class="field">
                <span>排序</span>
                <select id="sort-select">
                  <option value="score_desc">推荐分从高到低</option>
                  <option value="score_asc">推荐分从低到高</option>
                  <option value="survival_desc">随机存活率从高到低</option>
                  <option value="dead_end_desc">死局率从高到低</option>
                  <option value="tile_count_desc">牌数从高到低</option>
                  <option value="batch_index_asc">批次序号从低到高</option>
                </select>
              </label>
            </div>

            <div class="button-row">
              <button id="apply-filters-button" class="primary-button">应用筛选</button>
              <button id="reset-filters-button" class="secondary-button">重置</button>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Overview</p>
                <h2>批次摘要</h2>
              </div>
            </div>
            <div class="summary-grid">
              <article class="summary-card">
                <span>候选总数</span>
                <strong id="summary-candidate-count">0</strong>
              </article>
              <article class="summary-card">
                <span>自动通过</span>
                <strong id="summary-accepted-count">0</strong>
              </article>
              <article class="summary-card">
                <span>待复核</span>
                <strong id="summary-review-count">0</strong>
              </article>
              <article class="summary-card">
                <span>正式关卡</span>
                <strong id="summary-runtime-count">0</strong>
              </article>
            </div>
            <div class="tag-cloud-block">
              <p class="mini-title">高频标签</p>
              <div id="top-tags" class="chip-wrap empty-state">加载中...</div>
            </div>
          </section>
        </aside>

        <section class="main-column">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Candidates</p>
                <h2>候选浏览器</h2>
              </div>
              <span id="candidate-count-badge" class="badge">0 条</span>
            </div>
            <div id="candidate-list" class="candidate-list empty-state">正在加载候选列表...</div>
          </section>
        </section>

        <aside class="detail-column">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Detail</p>
                <h2>候选详情</h2>
              </div>
            </div>
            <div id="detail-panel" class="detail-panel empty-state">先从候选浏览器中选择一局牌，再查看结构、指标和人工标记。</div>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
