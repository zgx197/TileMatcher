name: Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name. Leave empty to use project.godot.
        required: false
        default: ""
      version_code:
        description: Android version code. Leave empty to use project.godot.
        required: false
        default: ""
      package_name:
        description: Android package name. Leave empty to use project.godot.
        required: false
        default: ""
      orientation:
        description: Android manifest orientation. Leave empty to use project.godot.
        required: false
        default: ""
      tag_name:
        description: Release tag name. Leave empty to use v<version_name>.
        required: false
        default: ""
      build_android:
        description: Build Android APK.
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows zip.
        required: true
        type: boolean
        default: true
      publish_release:
        description: Create or update a GitHub Release and upload all selected artifacts.
        required: true
        type: boolean
        default: true
      prerelease:
        description: Mark workflow_dispatch releases as prerelease.
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: multi-platform-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6.1
  GODOT_RELEASE_STATUS: stable
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.1
  GRADLE_VERSION: 8.11.1

jobs:
  metadata:
    runs-on: windows-2022
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      package_name: ${{ steps.meta.outputs.package_name }}
      orientation: ${{ steps.meta.outputs.orientation }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
      selected_targets: ${{ steps.meta.outputs.selected_targets }}
      matrix: ${{ steps.meta.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build metadata and targets
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || '' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || '' }}
          INPUT_PACKAGE_NAME: ${{ github.event.inputs.package_name || '' }}
          INPUT_ORIENTATION: ${{ github.event.inputs.orientation || '' }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name || '' }}
          INPUT_BUILD_ANDROID: ${{ github.event.inputs.build_android || 'true' }}
          INPUT_BUILD_WINDOWS: ${{ github.event.inputs.build_windows || 'true' }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release || 'true' }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
        run: |
          $projectSettings = Get-Content "godot/project.godot" -Raw -Encoding UTF8

          function Get-MatchValue {
            param(
              [string]$Pattern,
              [string]$Label
            )

            $match = [regex]::Match(
              $projectSettings,
              $Pattern,
              [System.Text.RegularExpressions.RegexOptions]::Multiline)

            if (-not $match.Success) {
              throw "Failed to resolve $Label from godot/project.godot"
            }

            return $match.Groups[1].Value
          }

          $defaultVersionName = Get-MatchValue '^\s*version_name="([^"]+)"\r?$' "version_name"
          $defaultVersionCode = Get-MatchValue '^\s*version_code=(\d+)\r?$' "version_code"
          $defaultPackageName = Get-MatchValue '^\s*package_name="([^"]+)"\r?$' "package_name"
          $defaultOrientation = Get-MatchValue '^\s*manifest_orientation="([^"]+)"\r?$' "manifest_orientation"

          $versionName = if ([string]::IsNullOrWhiteSpace($env:INPUT_VERSION_NAME)) { $defaultVersionName } else { $env:INPUT_VERSION_NAME.Trim() }
          $versionCode = if ([string]::IsNullOrWhiteSpace($env:INPUT_VERSION_CODE)) { $defaultVersionCode } else { $env:INPUT_VERSION_CODE.Trim() }
          $packageName = if ([string]::IsNullOrWhiteSpace($env:INPUT_PACKAGE_NAME)) { $defaultPackageName } else { $env:INPUT_PACKAGE_NAME.Trim() }
          $orientation = if ([string]::IsNullOrWhiteSpace($env:INPUT_ORIENTATION)) { $defaultOrientation } else { $env:INPUT_ORIENTATION.Trim() }

          if ($env:EVENT_NAME -eq "push") {
            $tagName = $env:REF_NAME
            if ($tagName.StartsWith("v")) {
              $versionName = $tagName.Substring(1)
            } else {
              $versionName = $tagName
              $tagName = "v$tagName"
            }

            $buildAndroid = $true
            $buildWindows = $true
            $publishRelease = "true"
            $prerelease = "false"
          } else {
            $tagName = if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG_NAME)) { "v$versionName" } else { $env:INPUT_TAG_NAME.Trim() }
            $buildAndroid = $env:INPUT_BUILD_ANDROID.ToLowerInvariant() -eq "true"
            $buildWindows = $env:INPUT_BUILD_WINDOWS.ToLowerInvariant() -eq "true"
            $publishRelease = $env:INPUT_PUBLISH_RELEASE.ToLowerInvariant()
            $prerelease = $env:INPUT_PRERELEASE.ToLowerInvariant()
          }

          if ($versionCode -notmatch '^\d+$') {
            throw "version_code must be numeric, got: $versionCode"
          }

          if ($orientation -notin @("portrait", "landscape")) {
            throw "orientation must be portrait or landscape, got: $orientation"
          }

          $targets = @()

          if ($buildAndroid) {
            $targets += [pscustomobject][ordered]@{
              target = "android"
              runner = "windows-2022"
              smoke_runner = "ubuntu-latest"
              upload_name = "release-android-$versionName"
              artifact_name = "TileMatcher-$versionName-android-debug.apk"
              artifact_relative_path = "godot/build/android/TileMatcher-$versionName-android-debug.apk"
              hash_relative_path = "godot/build/android/TileMatcher-$versionName-android-debug.apk.sha256.txt"
              summary_name = "Android"
            }
          }

          if ($buildWindows) {
            $targets += [pscustomobject][ordered]@{
              target = "windows"
              runner = "windows-2022"
              smoke_runner = "windows-2022"
              upload_name = "release-windows-$versionName"
              artifact_name = "TileMatcher-$versionName-windows-x64.zip"
              artifact_relative_path = "godot/build/windows/TileMatcher-$versionName-windows-x64.zip"
              hash_relative_path = "godot/build/windows/TileMatcher-$versionName-windows-x64.zip.sha256.txt"
              expected_zip_entry_prefix = "data_TileMatcher_windows_x86_64"
              summary_name = "Windows Desktop"
            }
          }

          if ($targets.Count -eq 0) {
            throw "At least one build target must be selected."
          }

          $selectedTargets = ($targets | ForEach-Object { $_.target }) -join ","
          $matrixJson = @{ include = @($targets) } | ConvertTo-Json -Compress -Depth 5

          "version_name=$versionName" >> $env:GITHUB_OUTPUT
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "orientation=$orientation" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "publish_release=$publishRelease" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "release_name=TileMatcher $tagName" >> $env:GITHUB_OUTPUT
          "selected_targets=$selectedTargets" >> $env:GITHUB_OUTPUT
          "matrix=$matrixJson" >> $env:GITHUB_OUTPUT

      - name: Publish metadata summary
        shell: pwsh
        run: |
          @"
          ## Release metadata

          - Trigger: `${{ github.event_name }}`
          - Version: `${{ steps.meta.outputs.version_name }}`
          - Version code: `${{ steps.meta.outputs.version_code }}`
          - Android package: `${{ steps.meta.outputs.package_name }}`
          - Android orientation: `${{ steps.meta.outputs.orientation }}`
          - Selected targets: `${{ steps.meta.outputs.selected_targets }}`
          - Release tag: `${{ steps.meta.outputs.tag_name }}`
          - Publish release: `${{ steps.meta.outputs.publish_release }}`
          - Prerelease: `${{ steps.meta.outputs.prerelease }}`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  export-targets:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: matrix.target == 'android'
        shell: pwsh
        run: |
          1..20 | ForEach-Object { "y" } | sdkmanager --licenses | Out-Null
          sdkmanager `
            "platform-tools" `
            "platforms;${{ env.ANDROID_PLATFORM }}" `
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Install .NET Android workload
        if: matrix.target == 'android'
        shell: pwsh
        run: |
          dotnet workload install android

      - name: Download pinned Gradle distribution
        if: matrix.target == 'android'
        shell: pwsh
        run: |
          $gradleDirectory = "build-support/gradle"
          $gradleArchivePath = Join-Path $gradleDirectory "gradle-${{ env.GRADLE_VERSION }}-bin.zip"

          New-Item -ItemType Directory -Path $gradleDirectory -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip" `
            -OutFile $gradleArchivePath

      - name: Install Godot editor and export templates
        shell: pwsh
        run: >
          .\scripts\install-godot-ci.ps1
          -Version "${{ env.GODOT_VERSION }}"
          -ReleaseStatus "${{ env.GODOT_RELEASE_STATUS }}"

      - name: Restore debug keystore
        if: matrix.target == 'android'
        id: keystore
        shell: pwsh
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_DEBUG_KEYSTORE_BASE64)) {
            throw "Missing secret: ANDROID_DEBUG_KEYSTORE_BASE64"
          }

          $keystoreDirectory = Join-Path $env:RUNNER_TEMP "android-keystore"
          New-Item -ItemType Directory -Path $keystoreDirectory -Force | Out-Null

          $keystorePath = Join-Path $keystoreDirectory "debug.keystore"
          $keystoreBase64 = $env:ANDROID_DEBUG_KEYSTORE_BASE64.Trim() -replace '\s', ''
          [System.IO.File]::WriteAllBytes(
            $keystorePath,
            [System.Convert]::FromBase64String($keystoreBase64))

          "path=$keystorePath" >> $env:GITHUB_OUTPUT

      - name: Write Godot editor settings
        if: matrix.target == 'android'
        shell: pwsh
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          $androidSdkRoot = if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            $env:ANDROID_SDK_ROOT
          } elseif (-not [string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) {
            $env:ANDROID_HOME
          } else {
            throw "ANDROID_SDK_ROOT and ANDROID_HOME are both empty after Android SDK setup."
          }

          .\scripts\write-godot-editor-settings.ps1 `
            -JavaHome "$env:JAVA_HOME" `
            -AndroidSdkRoot $androidSdkRoot `
            -DebugKeystorePath "${{ steps.keystore.outputs.path }}" `
            -DebugKeystorePassword "$env:ANDROID_DEBUG_KEYSTORE_PASSWORD"

      - name: Resolve Godot executable path
        id: godot
        shell: pwsh
        run: |
          $godotRoot = Join-Path $env:RUNNER_TEMP "godot\editor"
          $godotExe = Get-ChildItem -LiteralPath $godotRoot -Recurse -Filter "Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE_STATUS }}_mono_win64.exe" -File | Select-Object -First 1
          if ($null -eq $godotExe) {
            throw "Godot executable not found under: $godotRoot"
          }

          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Set Godot NuGet source
        shell: pwsh
        run: |
          $godotRoot = Split-Path -Parent "${{ steps.godot.outputs.path }}"
          $nugetSource = Join-Path $godotRoot "GodotSharp\Tools\nupkgs"
          if (-not (Test-Path -LiteralPath $nugetSource)) {
            throw "Godot NuGet source not found: $nugetSource"
          }

          "GODOT_NUGET_SOURCE=$nugetSource" >> $env:GITHUB_ENV

      - name: Preflight Windows .NET build
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          dotnet --info
          dotnet build "godot/TileMatcher.sln"

      - name: Export Android APK
        if: matrix.target == 'android'
        shell: pwsh
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          $androidSdkRoot = if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            $env:ANDROID_SDK_ROOT
          } elseif (-not [string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) {
            $env:ANDROID_HOME
          } else {
            throw "ANDROID_SDK_ROOT and ANDROID_HOME are both empty after Android SDK setup."
          }

          .\scripts\build-android.ps1 `
            -GodotExe "${{ steps.godot.outputs.path }}" `
            -AndroidSdkRoot $androidSdkRoot `
            -JavaHome "$env:JAVA_HOME" `
            -KeystorePath "${{ steps.keystore.outputs.path }}" `
            -KeystorePassword "$env:ANDROID_DEBUG_KEYSTORE_PASSWORD" `
            -KeyAlias "$env:ANDROID_DEBUG_KEY_ALIAS" `
            -KeyPassword "$env:ANDROID_DEBUG_KEY_PASSWORD" `
            -PackageName "${{ needs.metadata.outputs.package_name }}" `
            -VersionName "${{ needs.metadata.outputs.version_name }}" `
            -VersionCode ${{ needs.metadata.outputs.version_code }} `
            -ManifestOrientation "${{ needs.metadata.outputs.orientation }}" `
            -OutputName "${{ matrix.artifact_name }}"

      - name: Validate Android package contents
        if: matrix.target == 'android'
        shell: pwsh
        run: |
          $artifactPath = "${{ matrix.artifact_relative_path }}"
          if (-not (Test-Path -LiteralPath $artifactPath)) {
            throw "Android artifact not found for validation: $artifactPath"
          }

          $buildToolsRoot = Join-Path $env:ANDROID_SDK_ROOT "build-tools"
          $buildToolsDir = Get-ChildItem -LiteralPath $buildToolsRoot -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $buildToolsDir) {
            throw "Android build-tools directory was not found under: $buildToolsRoot"
          }

          $aaptPath = Join-Path $buildToolsDir.FullName "aapt.exe"
          if (-not (Test-Path -LiteralPath $aaptPath)) {
            throw "aapt.exe not found under: $($buildToolsDir.FullName)"
          }

          $badgingOutput = & $aaptPath dump badging $artifactPath | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "aapt dump badging failed with exit code $LASTEXITCODE"
          }

          foreach ($expectedSnippet in @(
            "package: name='${{ needs.metadata.outputs.package_name }}'",
            "versionCode='${{ needs.metadata.outputs.version_code }}'",
            "versionName='${{ needs.metadata.outputs.version_name }}'",
            "native-code: 'arm64-v8a'"
          )) {
            if ($badgingOutput.IndexOf($expectedSnippet, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Android badging output is missing expected text: $expectedSnippet"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $artifactPath).Path)
          try {
            $entryNames = @($archive.Entries | Select-Object -ExpandProperty FullName)
            foreach ($requiredEntry in @(
              "lib/arm64-v8a/libgodot_android.so",
              "assets/project.binary",
              "assets/_cl_",
              "assets/.godot/mono/publish/arm64/TileMatcher.dll",
              "assets/scripts/app/AppRoot.cs",
              "assets/scenes/app/AppRoot.tscn.remap"
            )) {
              if ($entryNames -notcontains $requiredEntry) {
                throw "Android package is missing required entry: $requiredEntry"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Export Windows zip
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 `
            -GodotExe "${{ steps.godot.outputs.path }}" `
            -ProjectDir "godot" `
            -Targets windows `
            -VersionName "${{ needs.metadata.outputs.version_name }}"

      - name: Validate Windows package contents
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $artifactPath = "${{ matrix.artifact_relative_path }}"
          $expectedPrefix = "${{ matrix.expected_zip_entry_prefix }}"

          if (-not (Test-Path -LiteralPath $artifactPath)) {
            throw "Windows artifact not found for validation: $artifactPath"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $artifactPath).Path)
          try {
            $hasRuntimeDir = $archive.Entries |
              Where-Object {
                $normalizedEntryPath = $_.FullName.Replace('\', '/')
                $normalizedEntryPath.StartsWith("$expectedPrefix/", [System.StringComparison]::OrdinalIgnoreCase)
              } |
              Select-Object -First 1

            if ($null -eq $hasRuntimeDir) {
              throw "Windows package is missing runtime payload entries under '$expectedPrefix/'."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Collect Godot Mono build logs
        if: failure() && matrix.target == 'windows'
        shell: pwsh
        run: |
          $buildLogRoot = Join-Path $env:APPDATA "Godot\mono\build_logs"
          if (-not (Test-Path -LiteralPath $buildLogRoot)) {
            Write-Host "Godot Mono build log directory not found: $buildLogRoot"
            exit 0
          }

          $outputRoot = "godot-mono-build-logs"
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null

          Get-ChildItem -LiteralPath $buildLogRoot -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              $destinationPath = Join-Path $outputRoot $_.Name
              Copy-Item -LiteralPath $_.FullName -Destination $destinationPath -Force
            }

      - name: Upload Godot Mono build logs
        if: failure() && matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: godot-mono-build-logs-windows-${{ needs.metadata.outputs.version_name }}
          path: godot-mono-build-logs
          if-no-files-found: warn

      - name: Collect artifact metadata
        id: artifact
        shell: pwsh
        run: |
          $artifactRelativePath = "${{ matrix.artifact_relative_path }}"
          $hashRelativePath = "${{ matrix.hash_relative_path }}"

          if (-not (Test-Path -LiteralPath $artifactRelativePath)) {
            throw "Artifact not found: $artifactRelativePath"
          }

          if (-not (Test-Path -LiteralPath $hashRelativePath)) {
            throw "Artifact hash file not found: $hashRelativePath"
          }

          $hashLine = (Get-Content -LiteralPath $hashRelativePath -TotalCount 1).Trim()
          $sha256 = ($hashLine -split '\s+')[0].ToUpperInvariant()

          "artifact_path=$artifactRelativePath" >> $env:GITHUB_OUTPUT
          "artifact_name=${{ matrix.artifact_name }}" >> $env:GITHUB_OUTPUT
          "hash_path=$hashRelativePath" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: |
            ${{ steps.artifact.outputs.artifact_path }}
            ${{ steps.artifact.outputs.hash_path }}
          if-no-files-found: error

      - name: Publish target summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## ${{ matrix.summary_name }} export summary

          - Runner: `${{ matrix.runner }}`
          - Trigger: `${{ github.event_name }}`
          - Version: `${{ needs.metadata.outputs.version_name }}`
          - Target: `${{ matrix.target }}`
          - Artifact: `${{ steps.artifact.outputs.artifact_name }}`
          - SHA256: `${{ steps.artifact.outputs.sha256 }}`
          - Upload artifact: `${{ matrix.upload_name }}`
          - Release tag: `${{ needs.metadata.outputs.tag_name }}`
          - Publish release: `${{ needs.metadata.outputs.publish_release }}`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  smoke-targets:
    needs:
      - metadata
      - export-targets
    runs-on: ${{ matrix.smoke_runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download target build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: smoke-input

      - name: Enable KVM
        if: matrix.target == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator smoke launch
        if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: >
            pwsh -File ./scripts/smoke-android-apk.ps1
            -ApkPath "./smoke-input/${{ matrix.artifact_name }}"
            -PackageName "${{ needs.metadata.outputs.package_name }}"
            -LogOutputDir "./smoke-artifacts/android"

      - name: Windows extracted package smoke launch
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          .\scripts\smoke-windows-package.ps1 `
            -ArtifactZipPath ".\smoke-input\${{ matrix.artifact_name }}" `
            -ExtractDir ".\smoke-work\windows" `
            -LogOutputDir ".\smoke-artifacts\windows"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}-${{ needs.metadata.outputs.version_name }}
          path: smoke-artifacts
          if-no-files-found: warn

      - name: Publish smoke summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## ${{ matrix.summary_name }} smoke summary

          - Runner: `${{ matrix.smoke_runner }}`
          - Target: `${{ matrix.target }}`
          - Artifact: `${{ matrix.artifact_name }}`
          - Smoke logs artifact: `smoke-${{ matrix.target }}-${{ needs.metadata.outputs.version_name }}`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  release:
    needs:
      - metadata
      - export-targets
      - smoke-targets
    if: needs.metadata.outputs.publish_release == 'true'
    runs-on: windows-2022

    steps:
      - name: Download selected build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Inspect release asset bundle
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath "release-assets" -File -Recurse | Sort-Object Name
          if ($files.Count -eq 0) {
            throw "No release assets were downloaded."
          }

          $fileSummary = ($files | ForEach-Object { "- ``$($_.Name)``" }) -join [Environment]::NewLine

          @"
          ## Aggregated release assets

          - Selected targets: `${{ needs.metadata.outputs.selected_targets }}`
          - Asset count: `$($files.Count)`
          - Files:
          $fileSummary
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          name: ${{ needs.metadata.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
